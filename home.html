<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amik Messenger</title>

<style>
body{
background:#0a0a0a;
color:white;
font-family:Arial;
text-align:center;
padding-top:50px;
}

h1{
color:#7b61ff;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#7b61ff;
color:white;
}
</style>

</head>
<body>

<h1>Amik Messenger</h1>

<h2 id="welcome"></h2>

<button onclick="logout()">Logout</button>

<script>

const username = localStorage.getItem("username");

document.getElementById("welcome").innerText =
"Welcome " + username;

function logout(){
localStorage.clear();
window.location.href = "index.html";
}

</script>

</body>
</html>
